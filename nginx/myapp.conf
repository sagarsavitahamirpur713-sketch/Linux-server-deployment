# /etc/nginx/sites-available/myapp.conf
# Symlink into sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/myapp.conf /etc/nginx/sites-enabled/
#
# HTTPS certificate is issued/managed by certbot:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# Certbot will auto-edit this file to add the ssl_certificate lines below
# the first time you run it — the block shown here is what it produces.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Certbot uses this location for the HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/myapp.access.log;
    error_log  /var/log/nginx/myapp.error.log;

    location / {
        include proxy_params;
        proxy_pass http://unix:/opt/myapp/myapp.sock;
    }

    location /static/ {
        alias /opt/myapp/app/static/;
    }
}
